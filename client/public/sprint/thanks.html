<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request received — SIM XR</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon-tech.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --blue: #0057FF; --navy: #0B0F1A; --gray: #6B7280; --gray-light: #F5F6F8; --border: #E5E7EB; --white: #FFFFFF; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; color: var(--navy); background: var(--white); -webkit-font-smoothing: antialiased; line-height: 1.6; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); padding: 0.35rem 0.7rem; background: var(--gray-light); border: 1px solid var(--border); border-radius: 4px; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 700; letter-spacing: -0.02em; margin: 1rem 0 0.75rem; }
    h1 span { color: var(--blue); }
    p { color: var(--gray); font-size: 1rem; max-width: 480px; margin: 0 0 1.75rem; }
    a.btn { display: inline-block; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem; color: var(--white); background: var(--navy); padding: 0.7rem 1.4rem; border-radius: 8px; text-decoration: none; }
    a.btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Sprint inquiry</span>
    <h1>Request <span>received.</span></h1>
    <p>Thanks — we'll review the task you described and come back with a sprint scope: evaluation protocol, collection plan, and a fixed price. One reply from the team.</p>
    <a class="btn" href="/">Back to SIM XR</a>
  </div>
</body>
</html>
