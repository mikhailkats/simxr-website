<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Favicon: hostname-aware SVG (light variant on simxr.tech, dark on simxr.app)
         + shared PNG/ICO fallbacks for legacy browsers and iOS add-to-home-screen.
         IMPORTANT — the script comes BEFORE the static <link> tags. Earlier version
         had a static `<link rel="icon" href="/favicon.svg">` above the script and a
         setAttribute swap below: the browser eagerly fetched the dark favicon as
         soon as it parsed the static link, then committed to it before the script
         ran (favicon-cached). Running the script first and inserting the right
         <link> ourselves avoids that race. -->
    <script>
      // Inserts the SVG favicon <link> with the correct variant for this host.
      // Runs synchronously during <head> parse, so the link enters the DOM before
      // the browser scans for favicons.
      (function () {
        var h = window.location.hostname;
        var src = (h === 'simxr.tech' || h === 'www.simxr.tech')
          ? '/favicon-tech.svg'
          : '/favicon.svg';
        var link = document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/svg+xml';
        link.href = src;
        document.head.appendChild(link);
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <title>SIM XR — Teaching infrastructure for every robot</title>
    <meta name="description" content="SIM XR teaches existing robot models the customer-specific jobs they cannot do out of the box. We rebuild the job in simulation, people at home demonstrate it in VR, and we post-train the model and measure it against the original." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SIM XR — Every robot that ships will need someone to teach it" />
    <meta property="og:description" content="We rebuild the job in simulation, people at home demonstrate it in VR, and we post-train your model and measure it against the original. Results reported in simulation." />
    <meta property="og:image" content="https://simxr.tech/home/chain-poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SIM XR — Every robot that ships will need someone to teach it" />
    <meta name="twitter:description" content="We rebuild the job in simulation, people at home demonstrate it in VR, and we post-train your model and measure it against the original. Results reported in simulation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Familjen+Grotesk:wght@700&family=Instrument+Sans:wght@400;500&family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Crawler / no-JS fallback — non-rendering bots (program verifiers, search
      indexers, social previews that don't execute JS) get a concrete summary
      of the company plus a link to /about (a fully static HTML page with the
      business model, the founder, and partner programs).

      Why this exists: 2026-05-29 — Google for Startups rejection #2 cited
      inability to validate "a public website that clearly showcases a digital-
      native business model" from simxr.tech. Root cause was the React SPA
      shell rendering an empty <div id="root"></div> in raw HTML. The about.html
      static page is the real fix; this noscript block plus the JS-hydrated React
      app ensure the homepage itself is also non-empty in raw HTML.
    -->
    <noscript>
      <main style="font-family:system-ui,sans-serif;max-width:720px;margin:60px auto;padding:0 1.5rem;color:#191A1D;line-height:1.7">
        <h1 style="font-size:2rem;margin:0 0 1rem">SIM XR — Every robot that ships will need someone to teach it</h1>
        <p>SIM XR teaches existing robot models the customer-specific jobs they cannot do out of the box. A robotics team brings one job the robot fails and a walkthrough of the room. We rebuild the job in simulation, people at home demonstrate the missing skill in VR, and we post-train the team's model on those demonstrations and measure it against the original. NVIDIA Inception member. AWS Activate member.</p>
        <p><strong>What a customer buys:</strong> a fixed-price project around one failing task &mdash; validated demonstrations, a post-trained model if wanted, and a before-and-after number on one protocol. All results are reported in simulation.</p>
        <p><strong>What is live today:</strong> simxr.app &mdash; the operator console. An operator opens it in a Quest 3 browser, picks a server and records demonstrations as the robot.</p>
        <p>Read <a href="/what-we-do/">what we do</a> and the <a href="/about">about page</a>, or contact <a href="mailto:gm@simxr.tech">gm@simxr.tech</a>.</p>
      </main>
    </noscript>

    <!--
      Hidden static forms — required for Netlify Forms to detect them at build time.
      Netlify's HTML parser scans the deployed index.html for <form name="..." netlify>
      tags; the React-rendered runtime forms then submit to "/" using the matching
      form-name. Field names below MUST match the keys submitted from Home.tsx.
    -->
    <form name="early-access" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <textarea name="task"></textarea>
      <input type="text" name="demos" />
    </form>

    <form name="collaboration" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="area" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
